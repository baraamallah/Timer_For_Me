<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غرفة الهروب اللغوية - مؤقت</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <button id="fullscreen-btn" class="icon-btn" title="ملء الشاشة">⛶</button>
            </div>
            <h1>غرفة الهروب اللغوية</h1>
        </header>

        <main>
            <div id="timer-display" class="timer-display">
                00:00
            </div>

            <div class="controls">
                <button id="start-btn">ابدأ</button>
                <button id="pause-btn">توقف مؤقت</button>
                <button id="reset-btn">إعادة تعيين</button>
            </div>

            <div class="time-settings">
                <div class="setting-group">
                    <label for="minutes-input">الدقائق:</label>
                    <input type="number" id="minutes-input" min="0" max="120" value="30">
                </div>
                <div class="setting-group">
                    <label for="seconds-input">الثواني:</label>
                    <input type="number" id="seconds-input" min="0" max="59" value="0">
                </div>
                <button id="set-time-btn">تحديد الوقت</button>
            </div>

            <div class="presets">
                <button onclick="setPreset(5)">5 دق</button>
                <button onclick="setPreset(10)">10 دق</button>
                <button onclick="setPreset(15)">15 دق</button>
                <button onclick="setPreset(20)">20 دق</button>
                <button onclick="setPreset(30)">30 دق</button>
            </div>
        </main>

        <footer class="footer">
            <div class="logo-container">
                <!-- Replace 'assets/logo.png' with your actual logo file -->
                <img src="https://via.placeholder.com/150x80/1d3557/f1faee?text=Logo" alt="شعار غرفة الهروب اللغوية" id="logo-img">
            </div>
        </footer>
    </div>

    <button id="exit-fullscreen-btn" class="exit-btn">خروج من ملء الشاشة</button>
    <audio id="alarm-sound" src="assets/alarm.mp3"></audio>

    <script src="script.js"></script>
</body>
</html>
